appId: com.codyparham.tunebox
productName: Tunebox
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources/bin
    to: bin
    filter: ['yt-dlp.exe']
win:
  target: nsis
  icon: resources/icon.png
nsis:
  artifactName: Tunebox-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Tunebox
